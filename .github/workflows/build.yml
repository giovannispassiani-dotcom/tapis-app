name: Costruisci APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepara progetto
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor-community/background-geolocation @capacitor-community/text-to-speech
          npx cap init TapisApp it.giovanni.tapis --web-dir www
          npx cap add android
          npx cap sync android
      - name: Compila APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tapis-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
